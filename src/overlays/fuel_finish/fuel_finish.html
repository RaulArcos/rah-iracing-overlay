<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fuel &amp; Finish Overlay</title>
    <link rel="stylesheet" href="{{ url_for('overlays.serve_static', overlay_name='fuel_finish', filename='fuel_finish.css') }}">
    <link rel="stylesheet" href="{{ url_for('interface.serve_common_css', filename='overlay-theme.css') }}">
    <script src="{{ url_for('serve_common_js', filename='overlay_theme.js') }}"></script>
    <script src="{{ url_for('overlays.serve_static', overlay_name='fuel_finish', filename='fuel_finish.js') }}"></script>
    <script src="{{ url_for('serve_common_js', filename='socket.io.min.js') }}"></script>
</head>
<body>
    <div class="fuel-container rah-card pywebview-drag-region">
        <div class="rah-card__header">
            <span>Fuel &amp; Finish</span>
            <span id="fuel-status" class="rah-status rah-status--warn">Waiting for data</span>
        </div>
        <div class="rah-grid fuel-grid">
            <div class="rah-metric">
                <span class="rah-metric__label">Fuel</span>
                <span class="rah-metric__value rah-num"><span id="fuel-level">--</span><span class="rah-metric__unit">L</span></span>
            </div>
            <div class="rah-metric">
                <span class="rah-metric__label">Tank</span>
                <span class="rah-metric__value rah-num" id="fuel-pct">--</span>
            </div>
            <div class="rah-metric">
                <span class="rah-metric__label">Burn / lap</span>
                <span class="rah-metric__value rah-num"><span id="fuel-burn">--</span><span class="rah-metric__unit">L</span></span>
            </div>
            <div class="rah-metric">
                <span class="rah-metric__label">Laps of fuel</span>
                <span class="rah-metric__value rah-num" id="fuel-laps">--</span>
            </div>
            <div class="rah-metric">
                <span class="rah-metric__label">Laps to finish</span>
                <span class="rah-metric__value rah-num" id="fuel-finish-laps">--</span>
            </div>
            <div class="rah-metric">
                <span class="rah-metric__label">Needed</span>
                <span class="rah-metric__value rah-num"><span id="fuel-needed">--</span><span class="rah-metric__unit">L</span></span>
            </div>
            <div class="rah-metric">
                <span class="rah-metric__label">Add</span>
                <span class="rah-metric__value rah-num"><span id="fuel-add">--</span><span class="rah-metric__unit">L</span></span>
            </div>
            <div class="rah-metric">
                <span class="rah-metric__label">Sampled</span>
                <span class="rah-metric__value rah-num fuel-small" id="fuel-samples">0 laps</span>
            </div>
        </div>
        <div class="fuel-footer">
            <span id="fuel-basis">--</span>
            <span class="fuel-note">Advisory estimate from clean laps. No automatic refuel.</span>
        </div>
    </div>
</body>
</html>
